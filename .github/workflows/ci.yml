name: CI

on:
  push:
    branches: [main, release]
  pull_request:

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    # Compares the PR's package changes against the base branch, so it only runs on PRs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Blocks a PR that adds or upgrades to a package with a known vulnerability of
      # moderate severity or higher.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    # The build prerenders the public pages, so it needs a database to read from.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: windham_portal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/windham_portal
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters
      SEED_STAFF_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npx prisma migrate deploy

      # After applying every migration, the database must match schema.prisma exactly.
      # A difference means the schema was changed without creating a migration
      # (`npm run db:migrate`), which would otherwise only surface as a broken deploy.
      - name: Check migrations match the schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - run: npx prisma db seed

      - run: npm run build
